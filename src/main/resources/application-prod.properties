# Database Configuration for Production (using environment variables)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apiservice_db}
spring.datasource.username=${DB_USERNAME:apiservice_user}
spring.datasource.password=${DB_PASSWORD:apiservice_password}

# Production JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# Production Logging
logging.level.com.example.apiservice=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN